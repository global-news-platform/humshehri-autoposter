name: Humshehri Auto-Poster

# Runs in the cloud on GitHub's servers every 15 minutes, so news keeps
# getting posted even when your computer is off. The bot's randomized cadence
# is preserved: each run posts at most ONE article, and the SQLite database
# (committed back to the repo) records the next allowed posting time.
#
# If your repository is PUBLIC, GitHub Actions minutes are unlimited and you
# can safely change the cron below to '*/5 * * * *' (every 5 minutes).
# For a PRIVATE repo, keep 15 minutes to stay inside the free 2000-min/month
# allowance.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never run two autopost jobs at once (avoids conflicting DB commits).
concurrency:
  group: humshehri-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto-poster
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
        run: python main.py --once --cron --max-posts 1 --no-delay

      - name: Commit updated database
        run: |
          git config user.name "humshehri-bot"
          git config user.email "actions@github.com"
          git add -f posted_articles.db
          if git diff --cached --quiet; then
            echo "No new posts; nothing to commit."
          else
            git commit -m "chore: sync posted articles database [skip ci]"
            git push
          fi